set_schedule:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gardena_bluetooth
    slot:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 3
    start_time:
      example: "06:00:00"
      selector:
        time:
    duration:
      example: 600
      selector:
        number:
          min: 0
          max: 86399
          unit_of_measurement: s
          mode: box
    weekdays:
      example: ["mon", "wed", "fri"]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    active:
      selector:
        boolean:
    use_sensor:
      selector:
        boolean:
clear_schedule:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gardena_bluetooth
    slot:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 3
debug_read_schedule:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gardena_bluetooth
    slot:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
